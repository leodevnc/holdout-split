[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holdout-split"
version = "0.1.0"
description = "Build and freeze provenance-aware development and holdout datasets"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = []

[project.scripts]
holdout-split = "holdout_split.cli:main"

[tool.setuptools.packages.find]
include = ["holdout_split*"]
